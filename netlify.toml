[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  # Increase timeout for scraping functions (max 26 seconds for Pro plan, 10 seconds for free)
  # Note: This only applies to production, not local dev
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20.19.0"


[dev]
  framework = "vite"
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  functions = "netlify/functions"



# API route for scraping (serverless function)
[[redirects]]
  from = "/api/scrape"
  to = "/.netlify/functions/scrape"
  status = 200

# API route for company scraping
[[redirects]]
  from = "/api/scrape_company"
  to = "/.netlify/functions/scrape_company"
  status = 200

# API route for checking company history
[[redirects]]
  from = "/api/check_company_history"
